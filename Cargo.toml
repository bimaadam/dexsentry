[workspace]
members = [
    "crates/dexsentry-apk",
    "crates/dexsentry-dex",
    "crates/dexsentry-rules",
    "crates/dexsentry-core",
    "crates/dexsentry-ffi",
    "crates/dexsentry-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
aho-corasick = "1.1.5"
clap = { version = "4.6.7", features = ["derive"] }
insta = "1.49.0"
proptest = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
toml = "1.2.1"
tracing = "0.1.44"
uniffi = { version = "0.32.2", default-features = false }
x509-parser = "0.18.1"
zip = "9.5.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
